<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Naresh Murthy. Robotics to Space Systems." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.6" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#150E33"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#58A6FF" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="planet" cx="0.35" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#6FE3FF"/>
      <stop offset="0.5" stop-color="#1B5E9E"/>
      <stop offset="1" stop-color="#091A3A"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#3FD0FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3FD0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="140" cy="40" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="30" r="1"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="70" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="28" r="1"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="55" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="190" r="1"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="380" r="1.2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="390" r="1"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="400" r="1.1"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="7.5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="150" r="0.9"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="10s" repeatCount="indefinite"/></circle>
  </g>

  <!-- orbital system -->
  <circle cx="900" cy="215" r="95" fill="url(#halo)"/>

  <g transform="rotate(22 900 215)">
    <ellipse cx="900" cy="215" rx="190" ry="64" fill="none" stroke="#9B7BFF" stroke-opacity="0.55" stroke-dasharray="4 6"/>
    <circle r="4" fill="#B9A3FF">
      <animateMotion dur="17s" repeatCount="indefinite" path="M710,215 a190,64 0 1,1 380,0 a190,64 0 1,1 -380,0"/>
    </circle>
  </g>

  <g transform="rotate(-18 900 215)">
    <ellipse cx="900" cy="215" rx="270" ry="92" fill="none" stroke="#3FD0FF" stroke-opacity="0.5"/>
    <g>
      <rect x="-6" y="-3.5" width="12" height="7" fill="#FFFFFF"/>
      <rect x="-19" y="-2" width="10" height="4" fill="#3FD0FF"/>
      <rect x="9" y="-2" width="10" height="4" fill="#3FD0FF"/>
      <animateMotion dur="26s" repeatCount="indefinite" path="M630,215 a270,92 0 1,0 540,0 a270,92 0 1,0 -540,0"/>
    </g>
  </g>

  <circle cx="900" cy="215" r="46" fill="url(#planet)"/>
  <circle cx="900" cy="215" r="46" fill="none" stroke="#6FE3FF" stroke-opacity="0.35"/>

  <!-- telemetry tick marks -->
  <g stroke="#58A6FF" stroke-opacity="0.35">
    <path d="M1120 40H1160M1160 40V80"/>
    <path d="M1120 380H1160M1160 380V340"/>
  </g>

  <!-- identity -->
  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">
    <circle cx="74" cy="92" r="4" fill="#3FD0FF">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="90" y="97" font-size="16" fill="#8FB8E8" letter-spacing="2">NM-001 / ACTIVE</text>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="70" y="188" font-size="74" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Naresh Murthy</text>
    <text x="72" y="244" font-size="34" fill="#3FD0FF">Robotics → Space Systems</text>
    <line x1="72" y1="272" x2="360" y2="272" stroke="#58A6FF" stroke-opacity="0.5"/>
    <text x="72" y="306" font-size="22" fill="#C9D7EE">M.Sc. Space Science &amp; Technology</text>
    <text x="72" y="334" font-size="22" fill="#8FB8E8">University of Bremen</text>
    <text x="72" y="388" font-size="18" fill="#9B7BFF" letter-spacing="4">SPACE  •  ROBOTICS  •  SOFTWARE  •  CONTROL</text>
  </g>
</svg>
