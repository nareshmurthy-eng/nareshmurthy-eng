<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Learn, build, break, understand, build better." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.6" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#150E33"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#58A6FF" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="170" fill="url(#bg)"/>
  <rect width="1200" height="170" fill="url(#grid)"/>
  <path d="M0 150 Q600 20 1200 150" fill="none" stroke="#3FD0FF" stroke-opacity="0.4"/>
  <circle r="4" fill="#FFFFFF">
    <animateMotion dur="20s" repeatCount="indefinite" path="M0,150 Q600,20 1200,150"/>
  </circle>
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="92" font-size="30" fill="#FFFFFF">Learn → Build → Break → Understand → Build Better</text>
    <text x="600" y="128" font-size="20" fill="#8FB8E8">Robotics → Space Systems</text>
  </g>
</svg>
